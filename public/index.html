<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E3 Draft — Command Center</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0a'/><g stroke='%23ffb000' stroke-width='2.5' fill='none'><path d='M6 11V6h5M26 11V6h-5M6 21v5h5M26 21v5h-5'/></g><circle cx='16' cy='16' r='2.5' fill='%23fff'/></svg>" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-exposure="sun" data-view="field">
    <!--
      THESIS: A draft board framed like a camcorder viewfinder — the player pool is the
      subject, the chrome is framing instrumentation. Refuses the dark neon draft-room
      card queue every fantasy app ships.
      OWN-WORLD: Letterbox-black instrument rails wrapping a scene that re-exposes between
      SUN and NIGHT. White/black OSD ink, caution amber #FFB000, 45° zebra as the only
      texture, 1px HUD dot grid, corner focus brackets on every framed region, DSEG14
      segmented readouts, Saira Condensed for names.
      STORY: James is on the clock. He reads scarcity, plan health, and what just went,
      then picks — without hunting.
      FIRST VIEWPORT: Top rail carries format + REC lamp + tape counter. Scene fills the
      frame: ON THE BOARD (tier-banded available pool) left, PLANS center, MY TEAM and
      TRANSACTIONS right. Bottom rail holds the W—T zoom bar; primary action is the zoom
      stop plus star-to-target.
      FORM: Camcorder viewfinder OSD, user-pinned over the assigned direction (grounded
      candidate 3, agate sports page). Seed key 7cd0e59b.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish
      review, the verdict, and DESIGN.md.
    -->

    <div class="vf">
      <!-- ============================================================ top rail -->
      <header class="rail rail--top">
        <div class="rail__group">
          <span class="lamp" id="lamp" data-state="live">
            <svg class="ico ico--dot" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" /></svg>
            <span class="lamp__text seg" id="lampText">REC</span>
          </span>
          <span class="rail__sep" aria-hidden="true"></span>
          <span class="readout" id="format">E3 · 12T · 20R · HALF-PPR</span>
        </div>

        <div class="rail__group rail__group--center">
          <span class="clock" id="clockLabel">ON THE CLOCK</span>
          <strong class="clock__team" id="clockTeam">—</strong>
        </div>

        <div class="rail__group">
          <span class="counter seg" id="counter" aria-label="Current round and pick">R00:P00</span>
          <span class="readout" id="overall">#000 / 240</span>
          <span class="rail__sep" aria-hidden="true"></span>
          <!-- The one number that governs urgency on the clock: how far away
               James's own next pick is. Sized to be read without looking for. -->
          <span class="uptick" id="uptick">
            <span class="uptick__k">YOU IN</span>
            <span class="uptick__v seg" id="uptickV">—</span>
            <span class="uptick__at seg" id="uptickAt">—</span>
          </span>
        </div>
      </header>

      <!-- ========================================================= pick entry -->
      <!-- Directly under the top rail and outside the view switcher, so it is on
           screen on every framing. This app is the board now: every pick lands
           here, so it sits where the eye already is rather than at the bottom
           edge. Hidden only in replay mode, where the 2025 fixture is read-only
           and the server refuses writes independently. -->
      <form class="entry" id="entry" hidden autocomplete="off">
        <span class="entry__at">
          <span class="entry__slot seg" id="entrySlot">—</span>
          <span class="entry__team" id="entryTeam">—</span>
        </span>
        <input
          class="entry__input"
          id="entryInput"
          type="text"
          placeholder="type the pick, press enter"
          aria-label="Enter the pick that was just made"
          spellcheck="false"
        />
        <p class="entry__echo" id="entryEcho" role="status" aria-live="polite"></p>
        <button class="entry__btn" type="button" id="entryUndo">UNDO</button>
      </form>

      <!-- ================================================================ scene -->
      <main class="scene" id="scene">
        <span class="bracket bracket--tl" aria-hidden="true"></span>
        <span class="bracket bracket--tr" aria-hidden="true"></span>
        <span class="bracket bracket--bl" aria-hidden="true"></span>
        <span class="bracket bracket--br" aria-hidden="true"></span>

        <!-- Warning strip: unmatched picks. Zebra = blown out, the one error state. -->
        <div class="zebra-alert" id="unmatched" hidden>
          <div class="zebra-alert__stripe" aria-hidden="true"></div>
          <div class="zebra-alert__body">
            <h2 class="zebra-alert__title seg">CHECK SHEET</h2>
            <p class="zebra-alert__text" id="unmatchedText"></p>
          </div>
        </div>

        <!-- Round cue: James's own note for the round in play, or the next one
             coming. Advisory only — no amber, no zebra. Those mean act now. -->
        <div class="cue" id="cue" hidden>
          <span class="cue__rd seg" id="cueRd">R00</span>
          <p class="cue__text" id="cueText"></p>
        </div>

        <!-- ---------------------------------------------------- VIEW: FIELD -->
        <div class="view view--field" id="viewField">
          <!-- ON THE BOARD ------------------------------------------------- -->
          <section class="panel panel--board" aria-labelledby="h-board">
            <div class="panel__head">
              <h2 class="panel__title seg" id="h-board">ON THE BOARD</h2>
              <div class="posbar" id="posbar" role="tablist" aria-label="Position filter"></div>
              <!-- Only appears once something is actually tagged or locked. A fresh
                   season starts with no watchlist, so it starts with no chrome. -->
              <div class="tagbar" id="tagbar" aria-label="Watchlist filter" hidden></div>
            </div>
            <div class="panel__body" id="boardList"></div>
          </section>

          <!-- VS + PLANS ----------------------------------------------------- -->
          <div class="stack stack--plans">
            <!-- Up to four players, held here on the fly for a side-by-side
                 look. Not written to disk — a scratch pad, not a watchlist —
                 so it clears on reload. Toggled from the VS mark beside the
                 lock icon on ON THE BOARD and beside the tag marks on PLANS. -->
            <section class="panel panel--vs" aria-labelledby="h-vs">
              <div class="panel__head">
                <h2 class="panel__title seg" id="h-vs">VS</h2>
                <span class="panel__meta" id="vsMeta"></span>
              </div>
              <div class="panel__body" id="vsList"></div>
            </section>

            <section class="panel panel--plans" aria-labelledby="h-plans">
              <div class="panel__head">
                <h2 class="panel__title seg" id="h-plans">PLANS</h2>
                <span class="panel__tools">
                  <span class="panel__meta" id="plansMeta"></span>
                  <button class="iconbtn" id="planEdit" aria-label="Open setup to edit plans and notes">
                    <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">
                      <path d="M2 4h12M2 8h12M2 12h12" />
                      <path d="M6 2.5v3M10.5 6.5v3M4.5 10.5v3" />
                    </svg>
                  </button>
                </span>
              </div>
              <div class="panel__body" id="plansList"></div>
            </section>
          </div>

          <!-- ROUND NOTES + MY TEAM + TRANSACTIONS ------------------------- -->
          <div class="stack stack--aside">
            <!-- James's own margin notes, years of them, one per round. They
                 used to run across the board grid a round at a time, which meant
                 reading ahead required leaving the FIELD. Here the whole run
                 scrolls in place while the cue strip still calls the round in
                 play. -->
            <section class="panel panel--notes" aria-labelledby="h-notes">
              <div class="panel__head">
                <h2 class="panel__title seg" id="h-notes">ROUND NOTES</h2>
                <span class="panel__meta" id="notesMeta"></span>
              </div>
              <div class="panel__body" id="notesList"></div>
            </section>

            <section class="panel panel--team" aria-labelledby="h-team">
              <div class="panel__head">
                <h2 class="panel__title seg" id="h-team">MY TEAM</h2>
                <span class="panel__meta" id="nextPick"></span>
              </div>
              <div class="panel__body" id="teamBody"></div>
            </section>

            <section class="panel panel--log" aria-labelledby="h-log">
              <div class="panel__head">
                <h2 class="panel__title seg" id="h-log">TRANSACTIONS</h2>
              </div>
              <div class="panel__body" id="logList"></div>
            </section>
          </div>
        </div>

        <!-- ---------------------------------------------------- VIEW: BOARD -->
        <div class="view view--grid" id="viewGrid">
          <section class="panel panel--grid" aria-labelledby="h-grid">
            <div class="panel__head">
              <h2 class="panel__title seg" id="h-grid">THE BOARD</h2>
              <span class="panel__tools">
                <span class="panel__meta" id="gridMeta">20 rounds · snake</span>
                <!-- Who is drafting where, and which column is James. Behind an
                     explicit mode because reordering re-cuts the snake, and
                     that is not something to do by brushing a header cell. -->
                <button class="ebtn" id="teamsEdit">TEAMS</button>
                <button class="ebtn" id="teamsSave" hidden>SAVE</button>
                <button class="ebtn" id="teamsCancel" hidden>CANCEL</button>
                <button class="ebtn" id="boardClear">CLEAR BOARD</button>
                <!-- Bulk keeper entry from KEEPERS26.md — for after a mock-draft
                     clear. See lib/keepers.js and /api/board/load-keepers. -->
                <button class="ebtn" id="loadKeepers">LOAD KEEPERS</button>
              </span>
            </div>
            <div class="panel__body panel__body--flush" id="gridBody"></div>
          </section>
        </div>

        <!-- --------------------------------------------------- VIEW: PLAYER -->
        <div class="view view--player" id="viewPlayer">
          <section class="panel panel--player" aria-labelledby="h-player">
            <div class="panel__head">
              <h2 class="panel__title seg" id="h-player">TARGET</h2>
              <span class="panel__meta">Locked targets and watch tags</span>
            </div>
            <div class="panel__body" id="playerBody"></div>
          </section>
        </div>
      </main>

      <!-- ========================================================= bottom rail -->
      <footer class="rail rail--bottom">
        <div class="rail__group">
          <span class="readout readout--stack">
            <span class="readout__k">POOL</span>
            <span class="readout__v seg" id="poolCount">—</span>
          </span>
          <span class="readout readout--stack">
            <span class="readout__k">GONE</span>
            <span class="readout__v seg" id="goneCount">—</span>
          </span>
        </div>

        <div class="zoom" role="tablist" aria-label="Framing">
          <span class="zoom__end seg" aria-hidden="true">W</span>
          <div class="zoom__track" id="zoomTrack">
            <span class="zoom__ticks" aria-hidden="true"></span>
            <span class="zoom__fill" id="zoomFill" aria-hidden="true"></span>
            <span class="zoom__marker" id="zoomMarker" aria-hidden="true"></span>
            <button class="zoom__stop" role="tab" data-view="grid" aria-selected="false">BOARD</button>
            <button class="zoom__stop" role="tab" data-view="field" aria-selected="true">FIELD</button>
            <button class="zoom__stop" role="tab" data-view="player" aria-selected="false">TARGET</button>
          </div>
          <span class="zoom__end seg" aria-hidden="true">T</span>
        </div>

        <div class="rail__group">
          <button class="exposure" id="exposure" aria-pressed="false">
            <svg class="ico" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="4" />
              <path d="M10 1v2.5M10 16.5V19M1 10h2.5M16.5 10H19M3.6 3.6l1.8 1.8M14.6 14.6l1.8 1.8M16.4 3.6l-1.8 1.8M5.4 14.6l-1.8 1.8" />
            </svg>
            <span class="exposure__text seg" id="exposureText">SUN</span>
          </button>
        </div>
      </footer>
    </div>

    <!-- ============================================================ focus card -->
    <!-- The viewfinder's own focus check: pull one subject out of the frame, look
         at everything known about him, put him back. This is where a star and a
         watch tag turn out to be the same act — both write one inventory record. -->
    <div class="focus" id="focus" hidden>
      <div class="focus__scrim" data-focus-close></div>
      <section class="panel focus__card" role="dialog" aria-modal="true" aria-labelledby="focusName">
        <div class="panel__head">
          <h2 class="panel__title focus__title" id="focusName">—</h2>
          <button class="iconbtn" data-focus-close aria-label="Close focus card">
            <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" /></svg>
          </button>
        </div>
        <div class="panel__body" id="focusBody"></div>
      </section>
    </div>

    <!-- ================================================================ setup -->
    <!-- MENU mode. Everything set before recording starts: the contingency plans
         and the round notes, which are the years of judgment this app exists to
         carry forward. Not meant to be opened on the clock. -->
    <div class="setup" id="setup" hidden>
      <div class="focus__scrim" data-setup-close></div>
      <section class="panel setup__card" role="dialog" aria-modal="true" aria-labelledby="setupTitle" tabindex="-1">
        <div class="panel__head">
          <h2 class="panel__title seg" id="setupTitle">SETUP</h2>
          <span class="panel__tools">
            <span class="panel__meta" id="setupMeta"></span>
            <button class="iconbtn" data-setup-close aria-label="Close setup">
              <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" /></svg>
            </button>
          </span>
        </div>
        <div class="panel__body" id="setupBody"></div>
        <div class="setup__foot">
          <span class="setup__hint" id="setupHint"></span>
          <button class="ebtn" data-setup-close>DISCARD</button>
          <button class="ebtn ebtn--go" id="setupSave" disabled>SAVE</button>
        </div>
      </section>
    </div>

    <datalist id="playerNames"></datalist>

    <script src="/app.js" type="module"></script>
  </body>
</html>
